<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Monster Type - Admin</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0f0a1f;color:#fff;padding:12px}.header{background:#4a1fa8;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.btn{padding:8px 14px;border:none;border-radius:8px;font-weight:800;cursor:pointer}.green{background:#4ade80}.red{background:#ff5a5a}.gray{background:#6b6b8a;color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}.card{background:#2d1a5a;border-radius:12px;padding:14px;text-align:center}.card b{font-size:32px;display:block;color:#ffb02e}table{width:100%;border-collapse:collapse;background:#1e1140;border-radius:12px;overflow:hidden;margin-top:10px}th{background:#4a1fa8;padding:10px;text-align:left;font-size:13px}td{padding:10px;border-bottom:1px solid #2d1a5a;font-size:14px}tr.gold{background:linear-gradient(90deg,#ffb02e,#ff8c00);color:#000;font-weight:900}</style></head><body><div class="header"><div><b style="font-size:20px">👾 Monster Type - ADMIN</b><br><small>Teacher Only</small></div><div><button class="btn gray" onclick="loadData()">🔄 Refresh</button><button class="btn green" onclick="exportCSV()">📥 Export</button><button class="btn red" onclick="clearAll()">🗑️ Clear</button></div></div><div class="cards"><div class="card">Total<br><b id="total">0</b></div><div class="card">Avg WPM<br><b id="avgWpm">0</b></div><div class="card">Avg Acc<br><b id="avgAcc">0%</b></div><div class="card">Top WPM<br><b id="topWpm">0</b></div></div><table><thead><tr><th>#</th><th>NAME</th><th>WPM</th><th>ACC</th><th>SCORE</th><th>TIME</th><th>ACTION</th></tr></thead><tbody id="tbody"></tbody></table><script>function loadData(){let list=JSON.parse(localStorage.getItem('monsterScores')||'[]');document.getElementById('total').textContent=list.length;let avgW=Math.round(list.reduce((a,b)=>a+b.wpm,0)/list.length)||0;document.getElementById('avgWpm').textContent=avgW;let avgA=Math.round(list.reduce((a,b)=>a+b.acc,0)/list.length)||0;document.getElementById('avgAcc').textContent=avgA+'%';document.getElementById('topWpm').textContent=(list[0]?.wpm||0);let tbody=document.getElementById('tbody');tbody.innerHTML=list.map((r,i)=>`<tr class="${i===0?'gold':''}"><td>${i+1}</td><td>${r.name}</td><td>${r.wpm} WPM</td><td>${r.acc}%</td><td>${r.score}</td><td>${r.time}</td><td><button onclick="del(${i})">❌</button></td></tr>`).join('')||'<tr><td colspan=7 style="text-align:center;padding:20px">No scores yet</td></tr>';}function del(i){let list=JSON.parse(localStorage.getItem('monsterScores')||'[]');list.splice(i,1);localStorage.setItem('monsterScores',JSON.stringify(list));loadData();}function clearAll(){if(confirm('Clear ALL?')){localStorage.removeItem('monsterScores');loadData();}}function exportCSV(){let list=JSON.parse(localStorage.getItem('monsterScores')||'[]');if(!list.length){alert('No data');return;}let csv='Rank,Name,WPM,Accuracy,Score,Time\n'+list.map((r,i)=>`${i+1},${r.name},${r.wpm},${r.acc}%,${r.score},${r.time}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Winners_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}loadData();setInterval(loadData,3000);</script></body></html>
